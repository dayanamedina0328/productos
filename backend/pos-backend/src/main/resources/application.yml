spring:
  application:
    name: pos-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/pos_db}
    username: ${DB_USERNAME:pos_user}
    password: ${DB_PASSWORD:pos_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration: 900000      # 15 minutos en ms
    refresh-token-expiration: 604800000  # 7 días en ms

logging:
  level:
    com.pos.backend: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
